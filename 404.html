<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found - Play a Game!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-center py-5">

  <div class="container">
      <h1 class="display-1 fw-bold text-danger">404</h1>
      <h2>Oops! Page Not Found</h2>
      <p class="text-muted">Chunkay yeh link abhi majood nahi, tab tak aap humara Tic‑Tac‑Toe game khelein!</p>

      <!-- Mini-Game Widget Container -->
      <div id="game-container">
          <h4 id="gameStatus">Player X's Turn</h4>
          <div class="game-grid">
              <div class="game-cell" data-index="0"></div>
              <div class="game-cell" data-index="1"></div>
              <div class="game-cell" data-index="2"></div>
              <div class="game-cell" data-index="3"></div>
              <div class="game-cell" data-index="4"></div>
              <div class="game-cell" data-index="5"></div>
              <div class="game-cell" data-index="6"></div>
              <div class="game-cell" data-index="7"></div>
              <div class="game-cell" data-index="8"></div>
          </div>
          <button id="resetGameBtn" class="btn btn-secondary btn-sm mt-3 w-100">Restart Game</button>
      </div>

      <a href="index.html" class="btn btn-primary btn-lg mt-4">Go Back Home</a>
  </div>

  <script>
      // Mini-Game Core Logic Module
      const statusDisplay = document.getElementById('gameStatus');
      let gameActive = true;
      let currentPlayer = "X";
      let gameState = ["", "", "", "", "", "", "", "", ""];
      const winningConditions = [
          [0, 1, 2], [3, 4, 5], [6, 7, 8],
          [0, 3, 6], [1, 4, 7], [2, 5, 8],
          [0, 4, 8], [2, 4, 6]
      ];

      document.querySelectorAll('.game-cell').forEach(cell => cell.addEventListener('click', (e) => {
          const clickedCell = e.target;
          const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

          if (gameState[clickedCellIndex] !== "" || !gameActive) return;

          gameState[clickedCellIndex] = currentPlayer;
          clickedCell.textContent = currentPlayer;

          let roundWon = false;
          for (let i = 0; i < winningConditions.length; i++) {
              const winCondition = winningConditions[i];
              let a = gameState[winCondition[0]];
              let b = gameState[winCondition[1]];
              let c = gameState[winCondition[2]];
              if (a === '' || b === '' || c === '') continue;
              if (a === b && b === c) { roundWon = true; break; }
          }

          if (roundWon) {
              statusDisplay.textContent = `Player ${currentPlayer} Has Won! 🎉`;
              gameActive = false;
              return;
          }

          if (!gameState.includes("")) {
              statusDisplay.textContent = `Game Ended in a Draw! 🤝`;
              gameActive = false;
              return;
          }

          currentPlayer = currentPlayer === "X" ? "O" : "X";
          statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
      }));

      document.getElementById('resetGameBtn').addEventListener('click', () => {
          gameActive = true;
          currentPlayer = "X";
          gameState = ["", "", "", "", "", "", "", "", ""];
          statusDisplay.textContent = "Player X's Turn";
          document.querySelectorAll('.game-cell').forEach(cell => cell.textContent = "");
      });
  </script>
</body>
</html>
